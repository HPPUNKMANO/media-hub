# "Gate": puts Navidrome and Audiobookshelf on their usual ports but removes the headers that forbid
# showing them inside the Media Hub (X-Frame-Options / frame-ancestors). Everything stays on your network.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 4533;
  client_max_body_size 0;
  location / {
    proxy_pass http://navidrome:4533;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
  }
}

server {
  listen 13378;
  client_max_body_size 0;
  location / {
    proxy_pass http://audiobookshelf:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
  }
}
